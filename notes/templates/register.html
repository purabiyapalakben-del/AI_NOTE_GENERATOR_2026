```html
{% extends "base.html" %}

{% block title %}
Register | AI Note Generator
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center align-items-center" style="min-height:80vh;">

        <div class="col-md-6 col-lg-5">

            <div class="glass-card">

                <div class="text-center mb-4">

                    <h1 style="font-size:60px;">🚀</h1>

                    <h2 class="fw-bold text-white">
                        Create Account
                    </h2>

                    <p class="text-light">
                        Join AI Note Generator and start creating smart notes.
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label text-white">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Choose a username"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label text-white">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label text-white">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label text-white">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm your password"
                            required>

                    </div>

                    <button class="btn btn-success w-100 py-3">

                        <i class="bi bi-person-plus-fill"></i>

                        Create Account

                    </button>

                </form>

                <hr class="text-light my-4">

                <p class="text-center text-light">

                    Already have an account?

                    <a href="{% url 'login' %}"
                       class="text-info text-decoration-none fw-bold">

                        Login Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
```
